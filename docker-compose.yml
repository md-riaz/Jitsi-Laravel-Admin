services:
  # Admin/orchestration stack only.
  # Jitsi Meet itself is NOT installed or run by this compose file.
  # Point the app at an external Jitsi instance via JITSI_DOMAIN.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:18090
      PORT: 8090
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
    ports:
      - "18090:8090"
    volumes:
      - app_storage:/var/www/html/storage
      - app_database:/var/www/html/database
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:18090
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
    depends_on:
      app:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage
      - app_database:/var/www/html/database
    command: ["php", "artisan", "queue:work", "database", "--tries=3", "--sleep=3", "--max-time=3600"]
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:18090
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
    depends_on:
      app:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage
      - app_database:/var/www/html/database
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    restart: unless-stopped

volumes:
  app_storage:
  app_database:
