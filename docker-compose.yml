services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8091:8090"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://openclaw.mdriaz.com.bd/jitsiadmin
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      RUN_MIGRATIONS: "true"
      PORT: 8090
    volumes:
      - ./database:/var/www/html/database
      - ./storage:/var/www/html/storage
      - /root/.jitsi-meet-cfg/jibri/recordings:/config/recordings
